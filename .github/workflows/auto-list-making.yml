# Build the sabun directory index when needed, then deploy the static site.
name: Deploy static content to Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for sabun changes
        id: changes
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" || "${{ github.event.before }}" == "0000000000000000000000000000000000000000" ]]; then
            echo "sabun=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "${{ github.event.before }}" "${{ github.sha }}" -- sabun/5 sabun/7; then
            echo "sabun=false" >> "$GITHUB_OUTPUT"
          else
            echo "sabun=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout apindex
        if: steps.changes.outputs.sabun == 'true'
        uses: actions/checkout@v4
        with:
          repository: smclt30p/apindex
          path: apindex_tool
      - name: Set up Python 3.8
        if: steps.changes.outputs.sabun == 'true'
        uses: actions/setup-python@v4
        with:
          python-version: 3.8
      - name: Generate sabun index
        if: steps.changes.outputs.sabun == 'true'
        run: |

          TEMPLATE_PATH=$(find apindex_tool -name "file.template.html" -print -quit)

          APINDEX_TOOL_DIR=$(pwd)/apindex_tool

          sed -i "s|@CMAKE_INSTALL_PREFIX@|$APINDEX_TOOL_DIR|g" apindex_tool/apindex.py
          sed -i "s|@CPACK_PACKAGE_VERSION_MAJOR@|2|g" apindex_tool/apindex.py "$TEMPLATE_PATH"
          sed -i "s|@CPACK_PACKAGE_VERSION_MINOR@|2|g" apindex_tool/apindex.py "$TEMPLATE_PATH"

          FOOTER_PATH=$(dirname "$TEMPLATE_PATH")/footer.template.html
          sed -i "s|https://thinkpads.org/projects/apindex|https://libthinkpad.github.io/projects/apindex|g" "$FOOTER_PATH"

          # Overwrite index.template.html with custom content
          INDEX_TEMPLATE_PATH=$(dirname "$TEMPLATE_PATH")/index.template.html
          cat <<'EOF' > "$INDEX_TEMPLATE_PATH"
          <!doctype html>
          <html>
          <head>
              <title>Index of #TITLE</title>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <meta name="robots" content="noindex, nofollow">
              <style>
                  * {
                  font-family: sans-serif;
                  }
              </style>
          </head>
              <body>
                  <h1>Index of #DIR</h1>
                  <hr>
                      <table>
                          <col style="width: 800px;">
                          <col style="width: 200px;">
                          <col style="width: 80px;">
                          <tr>
                              <th style="text-align: left;">Filename</th>
                              <th style="text-align: left;">Last modified</th>
                              <th style="text-align: left;">Size</th>
                          </tr>
                          #GEN_DIRS
                          #GEN_FILES
                      </table>
                  <hr>
                  <span>
                      #FOOTER
                  </span>
              </body>
          </html>
          EOF

          export TZ='Asia/Seoul'
          python apindex_tool/apindex.py ./sabun
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Stage site for deployment
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'apindex_tool' \
            ./ "$RUNNER_TEMP/site/"
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
